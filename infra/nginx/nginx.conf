events {}

http {
  # Self-declared Candidate data can appear in Application filters, Job
  # recommendation requests and the private Notification inbox. Keep access
  # logs useful without recording a query string or referrer that may contain
  # those values.
  log_format candidate_data_no_query
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_user_agent"';

  # Empty keys are not accounted, so CORS preflight and non-POST traffic do not
  # consume the password-recovery quota.
  map $request_method $auth_recovery_client_key {
    default "";
    POST $binary_remote_addr;
  }
  map $request_method $auth_recovery_instance_key {
    default "";
    POST $server_addr;
  }
  # This local limiter is a bounded safety net for the expensive Profile ->
  # pgvector -> Profile recruiter recommendation path. A shared ingress/WAF
  # limiter is still required when the gateway runs with multiple replicas.
  map $request_method $candidate_recommendation_client_key {
    default "";
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
  }
  map $request_method $candidate_recommendation_instance_key {
    default "";
    GET $server_addr;
    HEAD $server_addr;
  }
  # Keep this list synchronized with Auth Service CORS_ORIGINS when deploying.
  map $http_origin $auth_recovery_cors_origin {
    default "";
    "http://localhost:3000" "http://localhost:3000";
  }
  limit_req_zone $auth_recovery_client_key zone=auth_recovery_per_ip:10m rate=10r/m;
  limit_req_zone $auth_recovery_instance_key zone=auth_recovery_global:1m rate=20r/s;
  limit_req_zone $candidate_recommendation_client_key zone=candidate_recommendation_per_ip:10m rate=30r/m;
  limit_req_zone $candidate_recommendation_instance_key zone=candidate_recommendation_global:1m rate=10r/s;

  # Docker reassigns container IPs when a service is recreated. Without
  # periodic re-resolution Nginx keeps the startup IP, which can later belong
  # to a different service (e.g. /auth/login landing on application-service).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream auth { zone auth 64k; server auth-service:8080 resolve; }
  upstream profile { zone profile 64k; server profile-service:3000 resolve; }
  upstream company { zone company 64k; server company-service:3000 resolve; }
  upstream job { zone job 64k; server job-search-service:3000 resolve; }
  upstream application { zone application 64k; server application-service:8080 resolve; }
  upstream interview { zone interview 64k; server interview-service:8080 resolve; }
  upstream notification { zone notification 64k; server notification-service:8080 resolve; }
  upstream media { zone media 64k; server media-service:3000 resolve; }
  upstream admin { zone admin 64k; server admin-service:8080 resolve; }
  upstream chat { zone chat 64k; server chat-service:8080 resolve; }
  upstream ai { zone ai 64k; server ai-service:8000 resolve; }
  upstream video { zone video 64k; server video-service:8080 resolve; }

  server {
    listen 80;
    client_max_body_size 10m;
    
    set $auth_header $http_authorization;
    if ($cookie_careerhub_token) {
        set $auth_header "Bearer $cookie_careerhub_token";
    }
    proxy_set_header Authorization $auth_header;

    error_page 429 = @auth_recovery_limited;
    location @auth_recovery_limited {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      add_header Retry-After "60" always;
      # This response is deliberately generic and contains no account data.
      add_header Access-Control-Allow-Origin $auth_recovery_cors_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Expose-Headers "Retry-After" always;
      add_header Vary "Origin" always;
      return 429 '{"code":"AUTH_RECOVERY_RATE_LIMITED","message":"Too many password recovery requests","details":{"retryAfterSeconds":60}}';
    }
    location @candidate_recommendation_limited {
      default_type application/json;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Retry-After "60" always;
      add_header Vary "Authorization" always;
      return 429 '{"code":"CANDIDATE_RECOMMENDATION_RATE_LIMITED","message":"Too many candidate recommendation requests","details":{"retryAfterSeconds":60}}';
    }

    location = /auth/health { proxy_pass http://auth/actuator/health; }
    # Preserve the /auth prefix because Auth Service controllers are mounted below /auth.
    location ~ "^/auth/(?:forgot-password|reset-password)(?:[;/]|$)" {
      limit_req zone=auth_recovery_per_ip burst=5 nodelay;
      limit_req zone=auth_recovery_global burst=40 nodelay;
      limit_req_status 429;
      proxy_pass http://auth;
    }

    # Account control is an internal Auth API. Admin Service calls auth-service:8080
    # directly with the acting administrator's JWT; never expose it at the gateway.
    location ~ "^/auth/users(?:[;/]|$)" {
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      return 404;
    }

    location /auth/ { proxy_pass http://auth; }
    # Internal Profile/Application/Interview APIs are reachable only over the service
    # network. Match normalized repeated slashes, case variants and path
    # parameters or residual encoding so they cannot reach public proxies.
    location ~* "^/(?:profile|applications|interviews)/+(?:(?:[^/]+/+)*internal(?:[;/]|$)|.*%)" {
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      return 404;
    }
    location /profile/ {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://profile/;
    }
    location = /profile/job-preferences {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://profile/job-preferences;
    }
    location = /profile/recruiter-discovery {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://profile/recruiter-discovery;
    }
    # Next normalizes collection URLs without a trailing slash. Proxy these
    # directly to preserve POST bodies and avoid redirects to an internal host.
    location = /companies {
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://company/;
    }
    location /companies/ {
      # Strip the internal credential like every other service route does: the
      # gateway must never let a client present one, and Company now has a
      # key-guarded /metrics behind this path.
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_pass http://company/;
    }
    location = /jobs/recommended {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://job/recommended;
    }
    location ~* "^/jobs/[0-9a-f-]{36}/recommended-candidates/?$" {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      error_page 429 = @candidate_recommendation_limited;
      limit_req zone=candidate_recommendation_per_ip burst=10 nodelay;
      limit_req zone=candidate_recommendation_global burst=20 nodelay;
      limit_req_status 429;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      rewrite (?i)^/jobs/(.*)$ /$1 break;
      proxy_pass http://job;
    }
    location = /jobs {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://job/;
    }
    location /jobs/ {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://job/;
    }
    # Next.js canonicalizes /api/applications/ to /api/applications. Serve the
    # collection directly so nginx's automatic slash redirect cannot loop.
    location = /applications {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://application/;
    }
    location /applications/ {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://application/;
    }
    location /offers/ {
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://application;
    }
    # Interview owns the canonical /interviews prefix. Preserve it because the
    # Spring controller is mounted there; strip forged service identity and do
    # not log private request query/referrer data.
    location = /interviews {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://interview;
    }
    location /interviews/ {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://interview;
    }
    location = /calls {
      proxy_pass http://video;
    }
    location /calls/ {
      proxy_pass http://video;
    }
    
    # SSE Stream for real-time notifications
    location = /notifications/stream {
      proxy_pass http://notification;
      proxy_http_version 1.1;
      proxy_set_header Authorization $auth_header;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding off;
    }
    
    # Notification owns the canonical /notifications prefix. Preserve it for
    # both the collection path and nested resources, and never record private
    # pagination/filter values from the query string or referrer.
    location = /notifications {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://notification;
    }
    location /notifications/ {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://notification;
    }
    # Internal Media APIs are direct service-to-service only. Do not expose
    # verification, reference binding or privileged deletion at the gateway.
    location ~* "^/files/+internal(?:[;/]|$)" {
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      return 404;
    }
    location = /files {
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://media/;
    }
    location /files/ {
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://media/;
    }
    location /admin/ { proxy_pass http://admin/; }
    # Match/recommendation endpoints are service-to-service only. Block path
    # parameters, repeated slashes, case variants and residual encoding before
    # the generic AI proxy can normalize or forward them.
    location ~* "^/ai/+((?:match|recommend)(?:[;/]|$)|.*%)" {
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      return 404;
    }
    location /ai/ {
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://ai/;
    }

    location /chat/ {
      proxy_pass http://chat/;
      proxy_http_version 1.1;
      proxy_set_header Authorization $auth_header;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
