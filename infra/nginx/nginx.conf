events {}

http {
  upstream auth { server auth-service:8080; }
  upstream profile { server profile-service:3000; }
  upstream company { server company-service:3000; }
  upstream job { server job-search-service:3000; }
  upstream application { server application-service:8080; }
  upstream interview { server interview-service:8080; }
  upstream notification { server notification-service:3000; }
  upstream media { server media-service:3000; }
  upstream admin { server admin-service:8080; }
  upstream chat { server chat-service:3001; }
  upstream ai { server ai-service:8000; }

  server {
    listen 80;
    client_max_body_size 10m;

    location /auth/ { proxy_pass http://auth/; }
    location /profile/ { proxy_pass http://profile/; }
    location /companies/ { proxy_pass http://company/; }
    location /jobs/ { proxy_pass http://job/; }
    location /applications/ { proxy_pass http://application/; }
    location /interviews/ { proxy_pass http://interview/; }
    location /notifications/ { proxy_pass http://notification/; }
    location /files/ { proxy_pass http://media/; }
    location /admin/ { proxy_pass http://admin/; }
    location /ai/ { proxy_pass http://ai/; }

    location /chat/ {
      proxy_pass http://chat/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
