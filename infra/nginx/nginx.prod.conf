# ============================================================================
# nginx.prod.conf - Gateway production, ĐỘC LẬP với file local.
#
# - Cổng 80  : ACME (gia hạn cert) + redirect sang HTTPS
# - Cổng 443 : HTTPS, giải mã TLS, proxy tới các service qua HTTP
# - Cổng 8080: cùng server block với 443, KHÔNG TLS, KHÔNG publish ra host.
#              Dành cho container nội bộ (vd frontend SSR) gọi http://api-gateway:8080
#
# Mount:
#   ./infra/nginx/nginx.prod.conf -> /etc/nginx/nginx.conf (ro)
#   /etc/letsencrypt        -> /etc/letsencrypt      (ro)
#   /var/www/certbot        -> /var/www/certbot      (ro, dùng khi cấu hình gia hạn)
# Yêu cầu nginx >= 1.27.3 ("server ... resolve" trong upstream), http2 on >= 1.25.1.
# Lưu ý: nginx không kế thừa add_header/proxy_set_header từ cấp trên nếu location
# có khai báo riêng, nên mỗi location bên dưới tự khai báo đầy đủ.
# ============================================================================

events {
  worker_connections 4096;
}

http {
  # Không ghi query string/referrer vì có thể chứa dữ liệu ứng viên.
  log_format candidate_data_no_query
    '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_user_agent"';

  # Key rỗng thì không tính quota (preflight CORS và method khác không tốn quota).
  map $request_method $auth_recovery_client_key {
    default "";
    POST $binary_remote_addr;
  }
  map $request_method $auth_recovery_instance_key {
    default "";
    POST $server_addr;
  }
  map $request_method $candidate_recommendation_client_key {
    default "";
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
  }
  map $request_method $candidate_recommendation_instance_key {
    default "";
    GET $server_addr;
    HEAD $server_addr;
  }
  # Đồng bộ với CORS_ORIGINS của Auth Service.
  map $http_origin $auth_recovery_cors_origin {
    default "";
    "https://doantvv.ddns.net" "https://doantvv.ddns.net";
  }
  limit_req_zone $auth_recovery_client_key zone=auth_recovery_per_ip:10m rate=10r/m;
  limit_req_zone $auth_recovery_instance_key zone=auth_recovery_global:1m rate=20r/s;
  limit_req_zone $candidate_recommendation_client_key zone=candidate_recommendation_per_ip:10m rate=30r/m;
  limit_req_zone $candidate_recommendation_instance_key zone=candidate_recommendation_global:1m rate=10r/s;

  # Cookie careerhub_token -> header Bearer; nếu không có cookie thì dùng Authorization gốc.
  map $cookie_careerhub_token $auth_header {
    default "Bearer $cookie_careerhub_token";
    ""      $http_authorization;
  }

  # The public Google exchange must establish Next.js HttpOnly cookies. Its
  # server-side exchange then returns through the unpublished HTTP port 8080
  # to Auth. Routing both hops to Next would recursively proxy the same request.
  map $server_port $google_exchange_upstream {
    443     frontend_upstream;
    default auth;
  }

  # Next.js SSR calls /companies/... on the private gateway port. HTTPS
  # uses the same paths for frontend pages and /api/companies/... for JSON.
  # Preserve query strings while stripping the service prefix only internally.
  map "$server_port:$request_uri" $company_page_target {
    ~^8080:/companies/(?<company_service_uri>.*)$ http://company/$company_service_uri;
    ~^8080:/companies(?<company_collection_query>\?.*)?$ http://company/$company_collection_query;
    default http://frontend_upstream$request_uri;
  }


  # Chỉ gửi "Connection: upgrade" khi client thật sự yêu cầu WebSocket.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # Docker đổi IP container khi recreate; resolve lại định kỳ.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream auth { zone auth 64k; server auth-service:8080 resolve; }
  upstream profile { zone profile 64k; server profile-service:3000 resolve; }
  upstream company { zone company 64k; server company-service:3000 resolve; }
  upstream job { zone job 64k; server job-search-service:3000 resolve; }
  upstream application { zone application 64k; server application-service:8080 resolve; }
  upstream interview { zone interview 64k; server interview-service:8080 resolve; }
  upstream notification { zone notification 64k; server notification-service:8080 resolve; }
  upstream media { zone media 64k; server media-service:3000 resolve; }
  upstream admin { zone admin 64k; server admin-service:8080 resolve; }
  upstream chat { zone chat 64k; server chat-service:8080 resolve; }
  upstream ai { zone ai 64k; server ai-service:8000 resolve; }
  upstream video { zone video 64k; server video-service:8080 resolve; }
  upstream frontend_upstream { zone frontend 64k; server frontend:3000 resolve; }

  # ---------------- Cổng 80: ACME + redirect HTTPS ----------------
  server {
    listen 80;
    server_name doantvv.ddns.net;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------------- HTTPS (443) + nội bộ (8080) ----------------
  server {
    listen 443 ssl;
    listen 8080;
    http2 on;
    server_name doantvv.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/doantvv.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doantvv.ddns.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 10m;

    error_page 429 = @auth_recovery_limited;
    location @auth_recovery_limited {
      default_type application/json;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      add_header Retry-After "60" always;
      # Phản hồi chung chung, không chứa dữ liệu tài khoản.
      add_header Access-Control-Allow-Origin $auth_recovery_cors_origin always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Expose-Headers "Retry-After" always;
      add_header Vary "Origin" always;
      return 429 '{"code":"AUTH_RECOVERY_RATE_LIMITED","message":"Too many password recovery requests","details":{"retryAfterSeconds":60}}';
    }
    location @candidate_recommendation_limited {
      default_type application/json;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Retry-After "60" always;
      add_header Vary "Authorization" always;
      return 429 '{"code":"CANDIDATE_RECOMMENDATION_RATE_LIMITED","message":"Too many candidate recommendation requests","details":{"retryAfterSeconds":60}}';
    }

    # ======================== API routes ========================
    # Resolve canonical /api URLs through the existing guarded service routes.
    # More specific /api locations below retain their current proxy behavior.
    location = /api {
      default_type application/json;
      return 404 '{"code":"API_NOT_FOUND"}';
    }
    location /api/ {
      rewrite ^/api/(auth|profile|companies|jobs|applications|offers|interviews|notifications|files|admin|ai|chat|calls)(/.*)?$ /$1$2 last;
      default_type application/json;
      return 404 '{"code":"API_NOT_FOUND"}';
    }
    location = /auth/health {
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://auth/actuator/health;
    }
    # Giữ nguyên tiền tố /auth vì controller của Auth Service mount dưới /auth.
    location ~ "^/auth/(?:forgot-password|reset-password)(?:[;/]|$)" {
      limit_req zone=auth_recovery_per_ip burst=5 nodelay;
      limit_req zone=auth_recovery_global burst=40 nodelay;
      limit_req_status 429;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://auth;
    }
    # API nội bộ của Auth (Admin Service gọi trực tiếp auth-service:8080), không expose ra gateway.
    location ~ "^/auth/users(?:[;/]|$)" {
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      return 404;
    }
    # BFF routes của Next.js để thiết lập / hủy HttpOnly session cookies
    location /api/auth-cookie/ {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google redirects here after Auth creates the one-time exchange code.
    # This is a Next page, unlike /auth/google/callback owned by Spring.
    location = /auth/callback {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "no-store" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://frontend_upstream;
    }
    location = /auth/google/exchange {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "no-store" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://$google_exchange_upstream;
    }
    location /auth/ {
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://auth;
    }
    # Chặn API /internal của Profile/Application/Interview (gồm slash lặp, hoa/thường, path param, ký tự encode).
    location ~* "^/(?:profile|applications|interviews)/+(?:(?:[^/]+/+)*internal(?:[;/]|$)|.*%)" {
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      add_header Cache-Control "no-store" always;
      add_header Pragma "no-cache" always;
      return 404;
    }
    location /profile/ {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://profile/;
    }
    location = /profile/job-preferences {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://profile/job-preferences;
    }
    location = /profile/recruiter-discovery {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://profile/recruiter-discovery;
    }
    location ~ ^/companies(?:/|$) {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass $company_page_target;
    }
    location = /api/companies {
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://company/;
    }
    location /api/companies/ {
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://company/;
    }
    location = /jobs/recommended {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://job/recommended;
    }
    location ~* "^/jobs/[0-9a-f-]{36}/recommended-candidates/?$" {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      error_page 429 = @candidate_recommendation_limited;
      limit_req zone=candidate_recommendation_per_ip burst=10 nodelay;
      limit_req zone=candidate_recommendation_global burst=20 nodelay;
      limit_req_status 429;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      add_header Cache-Control "private, no-store" always;
      add_header Pragma "no-cache" always;
      add_header Vary "Authorization" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      rewrite (?i)^/jobs/(.*)$ /$1 break;
      proxy_pass http://job;
    }
    location = /jobs {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://job/;
    }
    location /jobs/ {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://job/;
    }
    # Next.js chuẩn hóa /api/applications/ thành /api/applications; phục vụ collection trực tiếp để tránh vòng lặp redirect.
    location = /applications {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $auth_header;
      proxy_set_header X-Internal-Api-Key "";
      proxy_set_header X-Internal-Service "";
      proxy_pass http://application/;
    }
    location /applications/ {
      access_log /var/log/nginx/access.log candidate_data_no_query;
      add_header Strict-Transport-Security "max-age=300" always;
      add_header X-Content-Type-Options "nosniff" always;
