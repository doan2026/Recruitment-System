name: recruitment-ai-service-test

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_test
      POSTGRES_USER: ai_test
      POSTGRES_PASSWORD: ai_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_test -d ai_test"]
      interval: 2s
      timeout: 2s
      retries: 15

  kafka-test:
    image: apache/kafka:3.8.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-test:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 2s
      timeout: 5s
      retries: 30

  ai-tests:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://ai_test:ai_test_password@postgres-test:5432/ai_test
      AI_TEST_DATABASE_URL: postgresql://ai_test:ai_test_password@postgres-test:5432/ai_test
      AI_TEST_KAFKA_BROKERS: kafka-test:9092
      INTERNAL_API_KEY: integration-test-internal-key
      INTERNAL_API_KEY_JOB_SEARCH: integration-job-search-key-00000001
    depends_on:
      postgres-test:
        condition: service_healthy
      kafka-test:
        condition: service_healthy
