name: recruitment-notification-service-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_test
      POSTGRES_USER: notification_test
      POSTGRES_PASSWORD: notification_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_test -d notification_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  kafka-test:
    image: apache/kafka:3.8.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-test:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 2s
      timeout: 5s
      retries: 30

  notification-tests:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://notification_test:notification_test_password@postgres-test:5432/notification_test?schema=notification
      KAFKA_BROKERS: kafka-test:9092
      KAFKA_APPLICATION_TOPIC: application-events
      KAFKA_NOTIFICATION_GROUP_ID: notification-integration-v1
      NOTIFICATION_KAFKA_CONSUMER_ENABLED: "true"
      NOTIFICATION_EVENT_MAX_BYTES: "65536"
      NOTIFICATION_APPLICATION_REPLAY_AFTER: "2026-08-27T00:00:00.000Z"
      NOTIFICATION_CURSOR_HMAC_KEY: notification-integration-cursor-key-000000000001
      JWT_ISSUER: https://auth.recruitment.local
      JWT_AUDIENCE: recruitment-api
      JWT_PUBLIC_KEY: integration-test-overridden-at-runtime
      SWAGGER_ENABLED: "false"
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      postgres-test:
        condition: service_healthy
      kafka-test:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - npx prisma migrate deploy && npm test && npx prisma migrate deploy
