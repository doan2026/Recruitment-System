services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - auth-service
      - chat-service
      - video-service
      - notification-service
    networks: [edge, backend]

  # ---------- Databases (mỗi service 1 DB riêng) ----------
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_secure_pass_123}
    volumes: [auth_db_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  chat-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-chat_secure_pass_123}
    volumes: [chat_db_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  video-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_db
      POSTGRES_USER: video_user
      POSTGRES_PASSWORD: ${VIDEO_DB_PASSWORD:-video_secure_pass_123}
    volumes: [video_db_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_user -d video_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notif_secure_pass_123}
    volumes: [notification_db_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ---------- Event bus (Redpanda - Kafka compatible) ----------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    networks: [backend]

  # ---------- Microservices ----------
  auth-service:
    build:
      context: ./services/auth-service
    env_file: ./services/auth-service/.env
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [backend]

  chat-service:
    build:
      context: ./services/chat-service
    env_file: ./services/chat-service/.env
    secrets:
      - jwt_public_key
    depends_on:
      chat-db:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks: [backend]

  video-service:
    build:
      context: ./services/video-service
    env_file: ./services/video-service/.env
    secrets:
      - jwt_public_key
    depends_on:
      video-db:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks: [backend]

  notification-service:
    build:
      context: ./services/notification-service
    env_file: ./services/notification-service/.env
    secrets:
      - jwt_public_key
    depends_on:
      notification-db:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks: [backend]

  frontend:
    build:
      context: ./frontend
    env_file: ./frontend/.env
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
    depends_on:
      - nginx
    networks: [edge]

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem

networks:
  edge:
  backend:

volumes:
  auth_db_data:
  chat_db_data:
  video_db_data:
  notification_db_data:
