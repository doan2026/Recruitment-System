upstream auth_service {
    server auth-service:8080;
}

upstream chat_service {
    server chat-service:8080;
}

upstream video_service {
    server video-service:8080;
}

upstream notification_service {
    server notification-service:8080;
}

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Auth Service
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://auth_service/;
        proxy_set_header X-Request-ID $request_id;
    }

    # Chat Service (REST)
    location /api/chat/ {
        proxy_pass http://chat_service/api/;
        proxy_set_header X-Request-ID $request_id;
    }

    # WebSocket Chat
    location /ws/chat {
        proxy_pass http://chat_service/ws/chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Request-ID $request_id;
    }

    # Video Service
    location /api/video/ {
        proxy_pass http://video_service/api/;
        proxy_set_header X-Request-ID $request_id;
    }

    # Notification Service - SSE stream
    location /api/notifications/stream {
        proxy_pass http://notification_service/api/notifications/stream;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header X-Request-ID $request_id;
    }

    # Notification Service - REST
    location /api/notifications/ {
        proxy_pass http://notification_service/api/notifications/;
        proxy_set_header X-Request-ID $request_id;
    }
}
