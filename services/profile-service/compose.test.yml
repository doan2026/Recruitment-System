name: recruitment-profile-service-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profile_test
      POSTGRES_USER: profile_test
      POSTGRES_PASSWORD: profile_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_test -d profile_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  kafka-test:
    image: apache/kafka:3.8.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-test:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 2s
      timeout: 5s
      retries: 30

  profile-tests:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://profile_test:profile_test_password@postgres-test:5432/profile_test?schema=profile
      ALLOW_PROFILE_SCHEMA_RESET: "true"
      MEDIA_SERVICE_URL: http://media-service.invalid:3000
      MEDIA_INTERNAL_API_KEY: profile-test-media-internal-key-000000000000
      APPLICATION_SERVICE_URL: http://application-service.invalid:8080
      APPLICATION_INTERNAL_API_KEY: profile-test-to-application-key-000000000000
      INTERNAL_API_KEY_APPLICATION: profile-test-application-key-0000000000000
      INTERNAL_API_KEY_JOB_SEARCH: profile-test-job-search-key-000000000000000
      MEDIA_REQUEST_TIMEOUT_MS: "300"
      APPLICATION_REQUEST_TIMEOUT_MS: "300"
      CV_DELETION_RECONCILE_ENABLED: "false"
      CV_MEDIA_CLEANUP_ENABLED: "false"
      CV_EVENT_PUBLISHER_ENABLED: "false"
      PROFILE_CV_EVENT_KAFKA_INTEGRATION: "1"
      KAFKA_BROKERS: kafka-test:9092
      KAFKA_CV_TOPIC: cv-events
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      postgres-test:
        condition: service_healthy
      kafka-test:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - npm run test:migration-upgrade && npx prisma migrate deploy && npm test && npx prisma migrate deploy
