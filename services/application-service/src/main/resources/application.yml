server:
  port: ${PORT:8080}

spring:
  application:
    name: application-service
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: application
  flyway:
    enabled: true
    create-schemas: true
    default-schema: application
    schemas: application
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: application-service

security:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key: ${JWT_PUBLIC_KEY:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    jwks-uri: ${JWT_JWKS_URI:}
    jwks-allowed-hosts: ${JWT_JWKS_ALLOWED_HOSTS:}
    allow-insecure-jwks: ${JWT_ALLOW_INSECURE_JWKS:false}
    jwks-timeout-ms: ${JWT_JWKS_TIMEOUT_MS:3000}
    jwks-cache-ttl-ms: ${JWT_JWKS_CACHE_TTL_MS:300000}
    jwks-refresh-cooldown-ms: ${JWT_JWKS_REFRESH_COOLDOWN_MS:10000}

clients:
  job-service-url: ${JOB_SERVICE_URL:http://job-search-service:3000}
  profile-service-url: ${PROFILE_SERVICE_URL:http://profile-service:3000}
  profile-internal-api-key: ${PROFILE_INTERNAL_API_KEY}
  ai-service-url: ${AI_SERVICE_URL:http://ai-service:8000}
  internal-api-key: ${INTERNAL_API_KEY}

internal:
  profile-api-key: ${INTERNAL_API_KEY_PROFILE}
  interview-api-key: ${INTERNAL_API_KEY_INTERVIEW}

application-events:
  topic: ${KAFKA_APPLICATION_TOPIC:application-events}
  publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}
  publish-initial-delay-ms: ${OUTBOX_PUBLISH_INITIAL_DELAY_MS:0}

application-offers:
  expiry-scan-delay-ms: ${OFFER_EXPIRY_SCAN_DELAY_MS:60000}
  expiry-scan-initial-delay-ms: ${OFFER_EXPIRY_SCAN_INITIAL_DELAY_MS:15000}
  expiry-batch-size: ${OFFER_EXPIRY_BATCH_SIZE:200}
  expiry-max-batches-per-scan: ${OFFER_EXPIRY_MAX_BATCHES_PER_SCAN:25}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /docs
