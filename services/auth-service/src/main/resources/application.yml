spring:
  application:
    name: auth-service
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false
  flyway:
    enabled: true
    default-schema: auth
    schemas: auth
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
        jdbc:
          time_zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

auth:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  otp:
    hmac-secret: ${OTP_HMAC_SECRET}
    ttl: 5m
    failure-block-duration: 15m
    max-failed-attempts: 5
    resend-window: 1h
    max-resends: 3
    claim-ttl: 30s
    dispatch-lock-ttl: 30s
  token:
    issuer: ${JWT_ISSUER:https://auth.recruitment.local}
    audience: ${JWT_AUDIENCE:recruitment-api}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    previous-public-key-paths: ${JWT_PREVIOUS_PUBLIC_KEY_PATHS:}
    allow-ephemeral-test-key: false
  login:
    hmac-secret: ${LOGIN_HMAC_SECRET}
    failure-window: 15m
    failure-block-duration: 15m
    max-failed-attempts: 5
  google:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/google/callback}
    frontend-redirect-uri: ${GOOGLE_FRONTEND_REDIRECT_URI:http://localhost:3000/auth/callback}
    secure-cookies: ${GOOGLE_SECURE_COOKIES:false}
    authorization-request-ttl: 10m
    exchange-ttl: 2m
  mail:
    from: ${SMTP_FROM:no-reply@recruitment.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
