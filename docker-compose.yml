name: recruitment-system

services:
  api-gateway:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - profile-service
      - company-service
      - job-search-service
      - application-service
      - interview-service
      - notification-service
      - media-service
      - admin-service
      - chat-service
      - ai-service

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"
    volumes:
      - kafka-data-apache:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        for topic in job-events cv-events application-events interview-events chat-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  auth-service:
    build: ./services/auth-service
    env_file:
      - ./services/auth-service/.env
    secrets:
      - source: jwt-private-key
        target: jwt-private.pem
      - source: jwt-public-key
        target: jwt-public.pem
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"

  application-service:
    build: ./services/application-service
    env_file:
      - ./services/application-service/.env
    environment:
      PROFILE_INTERNAL_API_KEY: ${PROFILE_INTERNAL_API_KEY_APPLICATION:?PROFILE_INTERNAL_API_KEY_APPLICATION is required}
      INTERNAL_API_KEY_PROFILE: ${APPLICATION_INTERNAL_API_KEY_PROFILE:?APPLICATION_INTERNAL_API_KEY_PROFILE is required}
    secrets:
      - source: jwt-public-key
        target: jwt-public.pem
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  interview-service:
    build: ./services/interview-service
    env_file:
      - ./services/interview-service/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  admin-service:
    build: ./services/admin-service
    env_file:
      - ./services/admin-service/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  profile-migrate:
    build: ./services/profile-service
    env_file:
      - ./services/profile-service/.env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "npm", "run", "prisma:migrate:deploy" ]

  profile-service:
    build: ./services/profile-service
    env_file:
      - ./services/profile-service/.env
    environment:
      JWT_JWKS_URI: http://auth-service:8080/auth/.well-known/jwks.json
      JWT_ALLOW_INSECURE_JWKS: "true"
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.recruitment.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-recruitment-api}
      MEDIA_SERVICE_URL: http://media-service:3000
      MEDIA_INTERNAL_API_KEY: ${MEDIA_INTERNAL_API_KEY_PROFILE:?MEDIA_INTERNAL_API_KEY_PROFILE is required}
      APPLICATION_SERVICE_URL: http://application-service:8080
      APPLICATION_INTERNAL_API_KEY: ${APPLICATION_INTERNAL_API_KEY_PROFILE:?APPLICATION_INTERNAL_API_KEY_PROFILE is required}
      INTERNAL_API_KEY_APPLICATION: ${PROFILE_INTERNAL_API_KEY_APPLICATION:?PROFILE_INTERNAL_API_KEY_APPLICATION is required}
      MEDIA_REQUEST_TIMEOUT_MS: ${PROFILE_MEDIA_REQUEST_TIMEOUT_MS:-3000}
      APPLICATION_REQUEST_TIMEOUT_MS: ${PROFILE_APPLICATION_REQUEST_TIMEOUT_MS:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SWAGGER_ENABLED: "true"
    secrets:
      - source: jwt-public-key
        target: jwt-public.pem
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      profile-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      media-service:
        condition: service_healthy
    expose:
      - "3000"

  company-service:
    build: ./services/company-service
    env_file:
      - ./services/company-service/.env
    secrets:
      - source: jwt-public-key
        target: jwt-public.pem
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  job-search-service:
    build: ./services/job-search-service
    env_file:
      - ./services/job-search-service/.env
    secrets:
      - source: jwt-public-key
        target: jwt-public.pem
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  notification-service:
    build: ./services/notification-service
    env_file:
      - ./services/notification-service/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  media-migrate:
    build:
      context: ./services/media-service
      target: build
    user: node
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=media
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "npm", "run", "prisma:migrate:deploy" ]
  media-service:
    build: ./services/media-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=media
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      CLOUDINARY_UPLOAD_PRESET_CV: ${CLOUDINARY_UPLOAD_PRESET_CV:-recruitment_cv_signed}
      CLOUDINARY_UPLOAD_PRESET_AVATAR: ${CLOUDINARY_UPLOAD_PRESET_AVATAR:-recruitment_avatar_signed}
      CLOUDINARY_UPLOAD_PRESET_COMPANY_LOGO: ${CLOUDINARY_UPLOAD_PRESET_COMPANY_LOGO:-recruitment_company_logo_signed}
      CLOUDINARY_UPLOAD_PRESET_COMPANY_IMAGE: ${CLOUDINARY_UPLOAD_PRESET_COMPANY_IMAGE:-recruitment_company_image_signed}
      CLOUDINARY_UPLOAD_PRESET_COMPANY_VIDEO: ${CLOUDINARY_UPLOAD_PRESET_COMPANY_VIDEO:-recruitment_company_video_signed}
      CLOUDINARY_UPLOAD_PRESET_CHAT_ATTACHMENT: ${CLOUDINARY_UPLOAD_PRESET_CHAT_ATTACHMENT:-recruitment_chat_attachment_signed}
      JWT_JWKS_URI: http://auth-service:8080/auth/.well-known/jwks.json
      JWT_ALLOW_INSECURE_JWKS: "true"
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.recruitment.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-recruitment-api}
      INTERNAL_API_KEY_PROFILE: ${MEDIA_INTERNAL_API_KEY_PROFILE:?MEDIA_INTERNAL_API_KEY_PROFILE is required}
      INTERNAL_API_KEY_COMPANY: ${MEDIA_INTERNAL_API_KEY_COMPANY:?MEDIA_INTERNAL_API_KEY_COMPANY is required}
      INTERNAL_API_KEY_APPLICATION: ${MEDIA_INTERNAL_API_KEY_APPLICATION:?MEDIA_INTERNAL_API_KEY_APPLICATION is required}
      INTERNAL_API_KEY_CHAT: ${MEDIA_INTERNAL_API_KEY_CHAT:?MEDIA_INTERNAL_API_KEY_CHAT is required}
      INTERNAL_API_KEY_INTERVIEW: ${MEDIA_INTERNAL_API_KEY_INTERVIEW:?MEDIA_INTERNAL_API_KEY_INTERVIEW is required}
      INTERNAL_API_KEY_AI: ${MEDIA_INTERNAL_API_KEY_AI:?MEDIA_INTERNAL_API_KEY_AI is required}
      MEDIA_CLEANUP_ENABLED: ${MEDIA_CLEANUP_ENABLED:-true}
      MEDIA_CLEANUP_INTERVAL_SECONDS: ${MEDIA_CLEANUP_INTERVAL_SECONDS:-300}
      MEDIA_CLEANUP_BATCH_SIZE: ${MEDIA_CLEANUP_BATCH_SIZE:-5}
      MEDIA_CLEANUP_LEASE_SECONDS: ${MEDIA_CLEANUP_LEASE_SECONDS:-300}
      MEDIA_CLEANUP_PROVIDER_TIMEOUT_SECONDS: ${MEDIA_CLEANUP_PROVIDER_TIMEOUT_SECONDS:-20}
      MEDIA_CLEANUP_RETRY_BASE_SECONDS: ${MEDIA_CLEANUP_RETRY_BASE_SECONDS:-30}
      MEDIA_CLEANUP_RETRY_MAX_SECONDS: ${MEDIA_CLEANUP_RETRY_MAX_SECONDS:-21600}
      MEDIA_CLEANUP_PROVIDER_GRACE_SECONDS: ${MEDIA_CLEANUP_PROVIDER_GRACE_SECONDS:-300}
      MEDIA_CLEANUP_CLEAN_INTERVAL_SECONDS: ${MEDIA_CLEANUP_CLEAN_INTERVAL_SECONDS:-60}
      MEDIA_CLEANUP_EXPIRED_RETENTION_SECONDS: ${MEDIA_CLEANUP_EXPIRED_RETENTION_SECONDS:-86400}
      MEDIA_CLEANUP_STARTUP_JITTER_SECONDS: ${MEDIA_CLEANUP_STARTUP_JITTER_SECONDS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SWAGGER_ENABLED: "true"
    secrets:
      - source: jwt-public-key
        target: jwt-public.pem
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      media-migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    expose:
      - "3000"

  chat-service:
    build: ./services/chat-service
    env_file:
      - ./services/chat-service/.env
    secrets:
      - source: jwt-public-key
        target: jwt-public.pem
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
      - kafka
    expose:
      - "3001"

  ai-service:
    build:
      context: ./services/ai-service
      target: runtime
    env_file:
      - ./services/ai-service/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)" ]
      interval: 10s
      timeout: 3s
      retries: 6

  ai-job-embedding-worker:
    build:
      context: ./services/ai-service
      target: worker
    env_file:
      - ./services/ai-service/.env
    restart: unless-stopped
    depends_on:
      ai-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ai-model-cache:/models

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  ai-model-cache:
  postgres-data:
  mongo-data:
  redis-data:
  kafka-data-apache:
  elasticsearch-data:

secrets:
  jwt-private-key:
    file: ${JWT_PRIVATE_KEY_FILE:-./secrets/jwt-private.pem}
  jwt-public-key:
    file: ${JWT_PUBLIC_KEY_FILE:-./secrets/jwt-public.pem}
